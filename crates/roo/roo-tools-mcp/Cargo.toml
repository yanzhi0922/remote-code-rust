[package]
name = "roo-tools-mcp"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/roo-code/rust"
description = "MCP tool implementations for Roo Code Rust"

[dependencies]
roo-types = { path = "../roo-types" }
roo-mcp = { path = "../roo-mcp" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }