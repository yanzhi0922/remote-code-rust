[package]
name = "roo-tools-fs"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/roo-code/rust"
description = "File system tool implementations for Roo Code Rust"

[dependencies]
roo-types = { path = "../roo-types" }
roo-diff = { path = "../roo-diff" }
roo-ignore = { path = "../roo-ignore" }
roo-protect = { path = "../roo-protect" }
roo-prompt = { path = "../roo-prompt" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"