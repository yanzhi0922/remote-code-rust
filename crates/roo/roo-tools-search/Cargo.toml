[package]
name = "roo-tools-search"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/roo-code/rust"
description = "Search tool implementations for Roo Code Rust"

[dependencies]
roo-types = { path = "../roo-types" }
roo-index = { path = "../roo-index" }
roo-ignore = { path = "../roo-ignore" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"