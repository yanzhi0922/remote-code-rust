[package]
name = "roo-tools-misc"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/roo-code/rust"
description = "Miscellaneous tool implementations for Roo Code Rust"

[dependencies]
roo-types = { path = "../roo-types" }
roo-skills = { path = "../roo-skills" }
roo-telemetry = { path = "../roo-telemetry" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }