[package]
name = "rc-codex-adapter"
description = "In-process Codex adapter that bridges codex-app-server-client into the AgentAdapter trait"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Our protocol layer
claude-agent-protocol = { path = "../../claude/claude-agent-protocol" }

# Codex crates (all in workspace)
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-protocol = { workspace = true }
codex-core = { workspace = true }
codex-config = { workspace = true }
codex-arg0 = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }

# UUID generation
uuid = { workspace = true, features = ["v4"] }

# Async trait
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Directory paths
directories = { workspace = true }

[lints]
workspace = true
