codex-image-generation-extension = { path = "agents/codex/codex-rs/ext/image-generation" }
codex-memories-extension = { path = "agents/codex/codex-rs/ext/memories" }
codex-web-search-extension = { path = "agents/codex/codex-rs/ext/web-search" }
# Other upstream crates missing from old fork
codex-app-server-daemon = { path = "agents/codex/codex-rs/app-server-daemon" }
codex-bwrap = { path = "agents/codex/codex-rs/bwrap" }
# codex-file-watcher — empty crate (Bazel-only), skip
