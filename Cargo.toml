codex-thread-manager-sample = { path = "agents/codex/codex-rs/thread-manager-sample" }
# Upstream aliases for test support crates
app_test_support = { path = "agents/codex/codex-rs/app-server/tests/common" }
core_test_support = { path = "agents/codex/codex-rs/core/tests/common" }
mcp_test_support = { path = "agents/codex/codex-rs/mcp-server/tests/common" }

	# ── Internal crate path dependencies (roo) ──────────────────────
	roo-types = { path = "crates/roo/roo-types" }
	roo-provider = { path = "crates/roo/roo-provider" }
	roo-tools = { path = "crates/roo/roo-tools" }
	roo-condense = { path = "crates/roo/roo-condense" }
	roo-tree-sitter = { path = "crates/roo/roo-tree-sitter" }

	# ── Roo-specific external deps ──────────────────────────────────
	fluent = "0.16"
	fluent-bundle = "0.15"
	git2 = { version = "0.21", default-features = false }
	gray_matter = "0.2"
	instant-distance = "0.2"
	jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }
	jsonschema = "0.26"
