[patch.crates-io]
# Local tao patch — graceful JavaException handling for Android 16 compat
tao = { path = "patches/tao-0.35.0" }
# Local wry patch — same getId() R8 stripping fix for Android 16
wry = { path = "patches/wry-0.55.0" }
# Codex patches — needed for tungstenite features (deflate, proxy) and tokio-tungstenite compat
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }

[workspace.lints.rust]
# Workspace policy: unsafe is allowed only in crates that opt in with
# `[lints.rust] unsafe_code = "allow"`.  New crates must justify unsafe
# usage in a safety comment; existing opt-ins are listed in those crates.
unsafe_code = "warn"

[workspace.lints.clippy]
absurd_extreme_comparisons = "allow"
collapsible_if = "allow"
dbg_macro = "deny"
derivable_impls = "allow"
filter_next = "allow"
if_same_then_else = "allow"
inconsistent_digit_grouping = "allow"
items_after_test_module = "allow"
manual_clamp = "allow"
manual_find = "allow"
manual_strip = "allow"
match_like_matches_macro = "allow"
needless_range_loop = "allow"
nonminimal_bool = "allow"
only_used_in_recursion = "allow"
ptr_arg = "allow"
redundant_closure = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_filter_map = "allow"
unnecessary_map_or = "allow"
unnecessary_to_owned = "allow"
# `unwrap_used` is too broad for a mixed workspace with upstream Codex/Roo code
# and thousands of test assertions. Keep concrete panic risks reviewed locally
# instead of making `cargo clippy --workspace --all-targets -D warnings`
# unusable as a release gate.
unwrap_used = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
# The workspace pulls in large native/FFI dependencies such as rusty_v8 and
# WebView/Tauri. Full Windows test builds with default debug info can exhaust
# pagefile/PDB/disk space before tests start, so keep test artifacts lean.
debug = 0
incremental = false
