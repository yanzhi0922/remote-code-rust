[workspace]
members = ["apps/*", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Proprietary"
authors = ["Yanzh"]
repository = "https://github.com/yanzhi0922/remote-code-rust"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["macros", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4.5.50", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
globset = "0.4.17"
ignore = "0.4.24"
once_cell = "1.21.3"
ratatui = "0.29.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
