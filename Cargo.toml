tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tungstenite = { version = "0.27.0", features = ["deflate"] }
which = "8"
wiremock = "0.6"
encoding_rs = "0.8.35"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
landlock = "0.4.4"
quick-xml = { version = "0.38.4", features = ["serialize"] }
seccompiler = "0.5.0"
strum = "0.27.2"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
eventsource-stream = "0.2.3"
