<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 560">
  <title id="title">Remote Code Rust</title>
  <desc id="desc">A local-first AI coding workspace connecting Claude-compatible, Codex, and Roo agents through a trusted local runtime and relay-only control plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.45" stop-color="#10233a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="160" y1="420" x2="440" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#93a4b8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #b7c4d8; }
      .tiny { font-size: 15px; }
      .small { font-size: 18px; }
      .label { font-size: 20px; font-weight: 700; fill: #eef6ff; }
      .card { fill: #0f1b2e; stroke: #263c57; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="34" fill="url(#grid)"/>
  <circle cx="1050" cy="92" r="190" fill="#0ea5e9" opacity="0.09"/>
  <circle cx="1050" cy="460" r="170" fill="#f59e0b" opacity="0.08"/>
  <circle cx="170" cy="470" r="160" fill="#14b8a6" opacity="0.08"/>

  <g transform="translate(72 72)">
    <g filter="url(#soft)">
      <rect x="0" y="0" width="508" height="416" rx="28" fill="#0b1424" stroke="#22344d"/>
      <g transform="translate(294 58) scale(0.24)" opacity="0.92">
        <path d="M251 318c130-167 386-183 535-44 166 156 149 445-34 574-161 114-392 80-514-80" fill="none" stroke="url(#brand)" stroke-width="90" stroke-linecap="round"/>
        <path d="M420 374 558 512 420 650" fill="none" stroke="#f8fafc" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M606 648h104" fill="none" stroke="url(#warm)" stroke-width="52" stroke-linecap="round"/>
        <circle cx="220" cy="468" r="36" fill="#0891b2"/>
        <circle cx="704" cy="266" r="36" fill="#2563eb"/>
      </g>
    </g>

    <text class="sans" x="34" y="46" fill="#e5f1ff" font-size="19" font-weight="700">REMOTE CODE RUST</text>
    <text class="sans" x="34" y="242" fill="#f8fafc" font-size="50" font-weight="800">Local-first</text>
    <text class="sans" x="34" y="298" fill="#f8fafc" font-size="50" font-weight="800">agent workspace</text>
    <text class="sans small muted" x="36" y="340">Claude-compatible + Codex + Roo</text>
    <text class="sans tiny muted" x="36" y="368">Your code and provider keys stay on trusted machines.</text>

    <g transform="translate(34 386)">
      <rect x="0" y="0" width="106" height="30" rx="15" fill="#12343a" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text class="sans tiny" x="16" y="20" fill="#a7f3d0">local keys</text>
      <rect x="118" y="0" width="108" height="30" rx="15" fill="#172554" stroke="#60a5fa" stroke-opacity="0.45"/>
      <text class="sans tiny" x="134" y="20" fill="#bfdbfe">Rust core</text>
      <rect x="238" y="0" width="126" height="30" rx="15" fill="#3b1a35" stroke="#f472b6" stroke-opacity="0.45"/>
      <text class="sans tiny" x="254" y="20" fill="#fbcfe8">remote UI</text>
    </g>
  </g>

  <g transform="translate(640 64)" filter="url(#soft)">
    <rect x="0" y="0" width="488" height="432" rx="28" fill="#0b1424" stroke="#22344d"/>

    <text class="sans" x="34" y="48" fill="#e5f1ff" font-size="21" font-weight="800">Runtime boundary</text>
    <text class="sans tiny muted" x="34" y="74">Execution stays on a trusted machine. Relay stays thin.</text>

    <g transform="translate(34 112)">
      <rect class="card" x="0" y="0" width="180" height="66" rx="14"/>
      <circle cx="34" cy="33" r="14" fill="url(#brand)"/>
      <text class="sans label" x="60" y="30">Desktop GUI</text>
      <text class="sans tiny muted" x="60" y="50">Tauri + React</text>
    </g>

    <g transform="translate(274 112)">
      <rect class="card" x="0" y="0" width="180" height="66" rx="14"/>
      <circle cx="34" cy="33" r="14" fill="url(#warm)"/>
      <text class="sans label" x="60" y="30">Runner</text>
      <text class="sans tiny muted" x="60" y="50">workspace host</text>
    </g>

    <path d="M214 145h54" fill="none" stroke="#67e8f9" stroke-width="2.2" marker-end="url(#arrow)"/>

    <g transform="translate(144 214)">
      <rect x="0" y="0" width="206" height="74" rx="18" fill="#10233a" stroke="#3b82f6" stroke-width="1.4"/>
      <text class="sans" x="28" y="32" fill="#e0f2fe" font-size="21" font-weight="800">Agent Router</text>
      <text class="mono tiny" x="28" y="55" fill="#93c5fd">UnifiedAgentEvent</text>
    </g>

    <path d="M124 178l72 35" fill="none" stroke="#67e8f9" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M363 178l-72 35" fill="none" stroke="#67e8f9" stroke-width="2.2" marker-end="url(#arrow)"/>

    <g transform="translate(34 330)">
      <rect class="card" x="0" y="0" width="128" height="54" rx="13"/>
      <text class="sans" x="22" y="32" fill="#d1fae5" font-size="17" font-weight="800">Claude</text>
    </g>
    <g transform="translate(180 330)">
      <rect class="card" x="0" y="0" width="128" height="54" rx="13"/>
      <text class="sans" x="31" y="32" fill="#bfdbfe" font-size="17" font-weight="800">Codex</text>
    </g>
    <g transform="translate(326 330)">
      <rect class="card" x="0" y="0" width="128" height="54" rx="13"/>
      <text class="sans" x="43" y="32" fill="#fce7f3" font-size="17" font-weight="800">Roo</text>
    </g>

    <path d="M218 288l-100 39" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M247 288v34" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M276 288l99 39" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(34 404)">
      <path d="M0 0h420" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.8"/>
      <text class="sans tiny" x="0" y="24" fill="#fde68a">Cloud relay: auth, pairing, stream tickets, approvals, artifacts</text>
    </g>
  </g>

  <g transform="translate(674 500)">
    <rect x="0" y="0" width="142" height="32" rx="16" fill="#10233a" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text class="sans tiny" x="19" y="21" fill="#ccfbf1">MCP ready</text>
    <rect x="154" y="0" width="142" height="32" rx="16" fill="#172554" stroke="#60a5fa" stroke-opacity="0.42"/>
    <text class="sans tiny" x="177" y="21" fill="#dbeafe">PWA/mobile</text>
    <rect x="308" y="0" width="150" height="32" rx="16" fill="#3b1a35" stroke="#f472b6" stroke-opacity="0.42"/>
    <text class="sans tiny" x="328" y="21" fill="#fce7f3">audit trails</text>
  </g>
</svg>
