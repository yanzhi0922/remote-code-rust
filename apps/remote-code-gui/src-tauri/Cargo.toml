[package]
name = "remote-code-gui"
version = "0.1.0"
description = "Remote Code GUI - Tauri Desktop Application"
authors = ["Yanzh"]
edition.workspace = true

[lib]
name = "remote_code_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
keyring = "2"
rc-core = { path = "../../../crates/claude/rc-core" }
rc-config = { path = "../../../crates/claude/rc-config" }
rc-tools = { path = "../../../crates/claude/rc-tools" }
rc-provider = { path = "../../../crates/claude/rc-provider" }
rc-session = { path = "../../../crates/claude/rc-session" }
rc-ui-bridge = { path = "../../../crates/claude/rc-ui-bridge" }
rc-permissions = { path = "../../../crates/claude/rc-permissions" }
rc-mcp = { path = "../../../crates/claude/rc-mcp" }
rc-plugins = { path = "../../../crates/claude/rc-plugins" }
rc-skills = { path = "../../../crates/claude/rc-skills" }
rc-agent-protocol = { path = "../../../crates/claude/rc-agent-protocol" }
rc-codex-adapter = { path = "../../../crates/claude/rc-codex-adapter" }
rc-roo-adapter = { path = "../../../crates/claude/rc-roo-adapter" }
rc-voice = { path = "../../../crates/claude/rc-voice" }
rc-query-engine = { path = "../../../crates/claude/rc-query-engine" }
rc-engine-events = { path = "../../../crates/claude/rc-engine-events" }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
