[package]
name = "remote-code-gui"
version = "0.1.0"
description = "Remote Code GUI - Tauri Desktop Application"
authors = ["Yanzh"]
edition.workspace = true

[lib]
name = "remote_code_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
keyring = "2"
claude-core = { path = "../../../crates/claude/claude-core" }
claude-config = { path = "../../../crates/claude/claude-config" }
claude-tools = { path = "../../../crates/claude/claude-tools" }
claude-provider = { path = "../../../crates/claude/claude-provider" }
claude-session = { path = "../../../crates/claude/claude-session" }
claude-ui-bridge = { path = "../../../crates/claude/claude-ui-bridge" }
claude-permissions = { path = "../../../crates/claude/claude-permissions" }
claude-mcp = { path = "../../../crates/claude/claude-mcp" }
claude-plugins = { path = "../../../crates/claude/claude-plugins" }
claude-skills = { path = "../../../crates/claude/claude-skills" }
claude-agent-protocol = { path = "../../../crates/claude/claude-agent-protocol" }
rc-codex-adapter = { path = "../../../crates/adapters/rc-codex-adapter" }
rc-roo-adapter = { path = "../../../crates/adapters/rc-roo-adapter" }
rc-claude-adapter = { path = "../../../crates/adapters/rc-claude-adapter" }
claude-voice = { path = "../../../crates/claude/claude-voice" }
claude-query-engine = { path = "../../../crates/claude/claude-query-engine" }
claude-engine-events = { path = "../../../crates/claude/claude-engine-events" }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
mobile = []

[lints]
workspace = true
