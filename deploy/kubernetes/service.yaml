# =============================================================================
# Kubernetes Service: remote-code-control-plane
# =============================================================================
# Exposes the control-plane deployment inside the cluster (ClusterIP) and
# optionally to external traffic via an Ingress or LoadBalancer.
#
# Apply:
#   kubectl apply -f deploy/kubernetes/service.yaml
#
# Verify:
#   kubectl get svc remote-code-control-plane
# =============================================================================

---
# Internal ClusterIP service for inter-pod and runner communication.
apiVersion: v1
kind: Service
metadata:
  name: remote-code-control-plane
  namespace: default
  labels:
    app: remote-code-control-plane
    component: control-plane
spec:
  type: ClusterIP
  selector:
    app: remote-code-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: quic
      port: 4433
      targetPort: quic
      protocol: UDP
  sessionAffinity: None
  internalTrafficPolicy: Cluster

---
# Optional: Headless service for direct pod addressing (useful for QUIC
# affinity or stateful runner-to-control-plane connections).
apiVersion: v1
kind: Service
metadata:
  name: remote-code-control-plane-headless
  namespace: default
  labels:
    app: remote-code-control-plane
    component: control-plane
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: remote-code-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: quic
      port: 4433
      targetPort: quic
      protocol: UDP

---
