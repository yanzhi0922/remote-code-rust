name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full-history secret scan at 03:00 UTC (~11:00 Beijing) to catch
    # long-lived feature branches that never opened a PR to main.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  # Full workspace test binaries are large on Windows. Disabling test-profile
  # debuginfo avoids MSVC PDB LIMIT linker failures without changing behavior.
  CARGO_PROFILE_TEST_DEBUG: 0
  # Several Claude runtime tests build large async state machines. Windows
  # runners default to a 1 MiB test-thread stack, which is too small for those
  # futures even though the same tests pass with a normal application stack.
  RUST_MIN_STACK: 8388608

jobs:
  check:
    name: Check (${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/cargo_workspace_slice.py check ${{ matrix.slice }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/cargo_workspace_slice.py clippy ${{ matrix.slice }}

  audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --quiet

  panic-macros:
    name: Panic-macro budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Check unwrap/expect/panic!() budget
        run: python scripts/check_panic_macros.py

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.slice }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace slice (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_TEST_JOBS: "1"
          RUST_TEST_THREADS: "1"
        run: python scripts/cargo_workspace_slice.py test ${{ matrix.slice }}
      - name: Test workspace slice
        if: runner.os != 'Windows'
        env:
          CARGO_TEST_JOBS: "2"
        run: python scripts/cargo_workspace_slice.py test ${{ matrix.slice }}

  frontend:
    name: Frontend (GUI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remote-code-gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vite build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-check:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package remote-code-gui
