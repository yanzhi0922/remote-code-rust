name: CI

# Minimal GITHUB_TOKEN permissions: the CI jobs only read the repository,
# they do not push commits or create releases.  `contents: read` blocks a
# compromised step from pushing to main.  The `release.yml` workflow is the
# only one that needs `contents: write`, and it sets that explicitly.
permissions:
  contents: read

# Cancel in-progress runs of the same ref; this prevents old CI runs from
# consuming runner minutes after a developer force-pushes a branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cap any single job at 60 minutes; without this, a hung build can pin a
# runner for hours and starve later workflow runs.
timeout-minutes: 60

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full-history secret scan at 03:00 UTC (~11:00 Beijing) to catch
    # long-lived feature branches that never opened a PR to main.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  # Full workspace test binaries are large on Windows. Disabling test-profile
  # debuginfo avoids MSVC PDB LIMIT linker failures without changing behavior.
  CARGO_PROFILE_TEST_DEBUG: 0
  # Several Claude runtime tests build large async state machines. Windows
  # runners default to a 1 MiB test-thread stack, which is too small for those
  # futures even though the same tests pass with a normal application stack.
  RUST_MIN_STACK: 8388608

  # Pin Rust version explicitly so the workflow does not silently drift
  # when the dtolnay/rust-toolchain action's default ref advances. Each
  # job also passes `with: toolchain: 1.93.1` as a second layer of
  # defense (action versions are now `@v1` to avoid floating refs).
  RUSTUP_TOOLCHAIN: "1.93.1"

jobs:
  check:
    name: Check (${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/cargo_workspace_slice.py check ${{ matrix.slice }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.slice }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/cargo_workspace_slice.py clippy ${{ matrix.slice }}

  audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --quiet

  panic-macros:
    name: Panic-macro budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Check unwrap/expect/panic!() budget
        run: python scripts/check_panic_macros.py

  unsafe-audit:
    name: Unsafe block SAFETY comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Enforce SAFETY comments on every unsafe block
        run: python scripts/audit_unsafe_blocks.py --enforce

  cargo-deny:
    name: cargo-deny (licenses + bans + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Fetch advisory DB
        run: cargo deny fetch
      - name: Run cargo deny
        run: cargo deny check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.slice }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        slice: [claude, codex, roo, apps-shared]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace slice (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_TEST_JOBS: "1"
          RUST_TEST_THREADS: "1"
        run: python scripts/cargo_workspace_slice.py test ${{ matrix.slice }}
      - name: Test workspace slice
        if: runner.os != 'Windows'
        env:
          CARGO_TEST_JOBS: "2"
        run: python scripts/cargo_workspace_slice.py test ${{ matrix.slice }}

  frontend:
    name: Frontend (GUI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remote-code-gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vite build

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remote-code-gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build static frontend for Playwright
        run: npx vite build
      - name: Serve built frontend (background)
        run: |
          nohup npx vite preview --port 1421 --strictPort > /tmp/vite-preview.log 2>&1 &
          echo "vite_preview_pid=$!"
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:1421 >/dev/null 2>&1; then
              echo "preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start in 30s"
          cat /tmp/vite-preview.log
          exit 1
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:1421
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/remote-code-gui/playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-check:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package remote-code-gui

  tauri-bundle-dryrun:
    name: Tauri bundle dry run (weekly)
    # Catch Tauri 2 capability / CSP / bundler config regressions before they
    # surface at release time.  This builds the Linux AppImage on every push
    # so a Tauri config change that breaks the bundler fails CI within one
    # business day.  It does NOT run on every PR to keep CI latency low —
    # the cheaper `cargo check --package remote-code-gui` already covers
    # that case.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.93.1
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libcap-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            bubblewrap \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json
      - name: Build frontend
        working-directory: apps/remote-code-gui
        run: |
          npm ci
          npm run build
      - name: Build Tauri AppImage
        env:
          NODE_ENV: production
        run: cargo build --package remote-code-gui --release --features desktop
      - name: Verify AppImage artifact exists
        run: |
          find apps/remote-code-gui/src-tauri/target/release/bundle -name '*.AppImage' -print
