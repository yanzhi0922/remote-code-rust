name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: remote-code-rust-x86_64-pc-windows-msvc
            ext: .zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: remote-code-rust-x86_64-unknown-linux-gnu
            ext: .tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: remote-code-rust-aarch64-unknown-linux-gnu
            ext: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: remote-code-rust-x86_64-apple-darwin
            ext: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: remote-code-rust-aarch64-apple-darwin
            ext: .tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact }}"
          mkdir "$artifact"
          Get-ChildItem -Path "target/${{ matrix.target }}/release/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "$artifact/"
          }
          Compress-Archive -Path "$artifact/*" -DestinationPath "$artifact.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          artifact="${{ matrix.artifact }}"
          mkdir "$artifact"
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -executable ! -name '*.d' -exec cp {} "$artifact/" \;
          tar czf "$artifact.tar.gz" -C "$artifact" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
