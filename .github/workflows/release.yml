name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gates:
    name: Release Security Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo install cargo-audit --locked
      - run: cargo audit --quiet
      - run: npm ci
        working-directory: apps/remote-code-gui
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/
        working-directory: apps/remote-code-gui

  build:
    name: Build workspace tools ${{ matrix.target }}
    needs: [release-gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: remote-code-rust-x86_64-pc-windows-msvc
            ext: .zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: remote-code-rust-aarch64-pc-windows-msvc
            ext: .zip
          # Linux GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: remote-code-rust-x86_64-unknown-linux-gnu
            ext: .tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: remote-code-rust-aarch64-unknown-linux-gnu
            ext: .tar.gz
          # Linux MUSL (static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: remote-code-rust-x86_64-unknown-linux-musl
            ext: .tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: remote-code-rust-aarch64-unknown-linux-musl
            ext: .tar.gz
          # macOS
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: remote-code-rust-aarch64-apple-darwin
            ext: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: remote-code-rust-x86_64-apple-darwin
            ext: .tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross-compilation tools (x86_64-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar -xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }} --exclude remote-code-gui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "${{ matrix.artifact }}"
          mkdir "$artifact"
          Get-ChildItem -Path "target/${{ matrix.target }}/release/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "$artifact/"
          }
          Compress-Archive -Path "$artifact/*" -DestinationPath "$artifact.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          artifact="${{ matrix.artifact }}"
          mkdir "$artifact"
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -executable ! -name '*.d' -exec cp {} "$artifact/" \;
          tar czf "$artifact.tar.gz" -C "$artifact" .

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}.zip").Hash
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding utf8 -FilePath "${{ matrix.artifact }}.sha256"

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}.sha256

  cloud-relay:
    name: Build cloud relay artifact
    needs: [release-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: cloud-relay-x86_64-unknown-linux-gnu

      - name: Build relay-only control plane
        run: cargo build --release -p remote-code-control-plane --target x86_64-unknown-linux-gnu

      - name: Build Web/PWA frontend
        working-directory: apps/remote-code-gui
        run: |
          npm ci
          npm run build

      - name: Package relay artifact
        run: |
          artifact="remote-code-cloud-relay-x86_64-unknown-linux-gnu"
          mkdir "$artifact"
          cp target/x86_64-unknown-linux-gnu/release/remote-code-control-plane "$artifact/"
          cp -r apps/remote-code-gui/dist "$artifact/frontend"
          cp -r deploy "$artifact/"
          tar czf "$artifact.tar.gz" -C "$artifact" .
          sha256sum "$artifact.tar.gz" > "$artifact.sha256"

      - name: Upload relay artifact
        uses: actions/upload-artifact@v7
        with:
          name: remote-code-cloud-relay-x86_64-unknown-linux-gnu
          path: |
            remote-code-cloud-relay-x86_64-unknown-linux-gnu.tar.gz
            remote-code-cloud-relay-x86_64-unknown-linux-gnu.sha256

  desktop-installer-windows:
    name: Build Windows desktop installer
    needs: [release-gates]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remote-code-gui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-installer-x86_64-pc-windows-msvc

      - name: Build NSIS installer
        working-directory: apps/remote-code-gui
        shell: pwsh
        run: |
          npm ci
          npm run desktop:build

      - name: Normalize installer artifact name
        shell: pwsh
        run: |
          $candidates = @(
            "target/release/bundle/nsis/*.exe",
            "apps/remote-code-gui/src-tauri/target/release/bundle/nsis/*.exe"
          )
          $installer = $candidates |
            ForEach-Object { Get-ChildItem -Path $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          Copy-Item $installer.FullName "Remote-Code-windows-x64-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 "Remote-Code-windows-x64-setup.exe").Hash
          "$hash  Remote-Code-windows-x64-setup.exe" | Out-File -Encoding utf8 -FilePath "Remote-Code-windows-x64-setup.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Remote-Code-windows-x64-setup
          path: |
            Remote-Code-windows-x64-setup.exe
            Remote-Code-windows-x64-setup.sha256

  checksums:
    name: Aggregate Checksums
    needs: [build, cloud-relay, desktop-installer-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge SHA256 checksums
        run: |
          cat artifacts/*/*.sha256 > SHA256SUMS.txt
          sort -o SHA256SUMS.txt SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: SHA256SUMS.txt

  release:
    name: Create Release
    needs: [build, cloud-relay, desktop-installer-windows, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS/SHA256SUMS.txt
